name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
    
    - name: Configure BuildBuddy
      run: echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc-user
    
    - name: Install just
      run: brew install just
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run Lint
      run: just lint

  ios-build:
    name: iOS Build
    runs-on: macos-15
    
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 8

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true

    - name: Configure BuildBuddy
      run: echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc-user

    - name: Install just
      run: brew install just

    - name: Configure macro package trust
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

    - name: Install iOS Simulator Runtime
      run: |
        xcodebuild -downloadPlatform iOS
        xcrun simctl list runtimes

    - name: Run iOS Build
      run: just build-ios

  test:
    name: Test
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true

    - name: Configure BuildBuddy
      run: echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc-user

    - name: Install just
      run: brew install just

    - name: Configure macro package trust
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

    - name: Verify OpenSSH server availability
      run: |
        set -euxo pipefail
        ls -l /usr/sbin/sshd
        /usr/sbin/sshd -h || true
        /usr/bin/ssh -V || true
        /usr/bin/sftp -V || true
        /usr/bin/ssh-keygen -V || true

    - name: Run Tests
      run: just test

  integration-test:
    name: Integration Tests
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true

    - name: Configure BuildBuddy
      run: echo "build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}" > .bazelrc-user

    - name: Install just
      run: brew install just

    - name: Configure macro package trust
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

    - name: Verify OpenSSH server availability
      run: |
        set -euxo pipefail
        ls -l /usr/sbin/sshd
        /usr/sbin/sshd -h || true
        /usr/bin/ssh -V || true
        /usr/bin/sftp -V || true
        /usr/bin/ssh-keygen -V || true

    - name: Run Integration Tests
      run: just test-integration
